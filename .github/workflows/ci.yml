# P.1 CI/CD — Production / Operations
#
# Objetivo P.1: ¿Puede cada cambio del repositorio ser validado automáticamente
# antes de integrarse o publicarse?
#
# Pipeline: source change -> dependency install -> static/repository checks
#           -> deployment validation -> full tests -> Docker build validation
#
# Alcance: CI solamente. NO despliegue automático a producción (las tareas
# posteriores de Hito P no se implementan aquí). NO se usan secretos
# productivos. Permisos mínimos.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Mínimo privilegio: solo lectura del contenido del repositorio.
permissions:
  contents: read

# Cancela ejecuciones obsoletas de la misma PR; no cancela validaciones de
# commits ya integrados en master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Static / repository checks
        run: |
          python -m compileall -q mcp src scripts tests
          git status --porcelain

      - name: Deployment validation (O.13)
        run: python scripts/deploy_validate.py

      - name: Deployable environment profiles
        run: |
          python scripts/deploy_validate.py --environment development
          python scripts/deploy_validate.py --environment staging
          python scripts/deploy_validate.py --environment production

      - name: Full regression tests
        run: python -m pytest

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build O.13 Docker image
        run: docker build -t ia-autonomous-commerce:ci-test .

      - name: Container health / readiness smoke
        run: |
          docker run -d --name ci-smoke -p 127.0.0.1:18080:8000 \
            ia-autonomous-commerce:ci-test
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18080/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:18080/health"
          curl -fsS "http://127.0.0.1:18080/ready"
          docker stop ci-smoke
          docker rm ci-smoke